name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          # 如果有测试命令，请在此处替换
          echo "Running tests..."
          
      - name: Check Docker secrets (only on main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ] || [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "ERROR: DOCKER_USERNAME or DOCKER_PASSWORD secrets not set. Please configure repository secrets.";
            exit 1;
          fi

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 多标签：commit sha 与 latest（仅在 main）
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/EAW:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/EAW:latest

  build-for-prs:
    name: Build (PR / fork safe)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        run: |
          IMAGE_TAG="eaw-pr-${{ github.sha }}"
          docker build -t "$IMAGE_TAG" .
          docker save "$IMAGE_TAG" -o "./${IMAGE_TAG}.tar"

      - name: Upload image tar artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: ./eaw-pr-${{ github.sha }}.tar
