{% extends 'base_generic.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/calendar.css' %}">

<div class="container mt-4">
  <h1 class="mb-4">复习日历</h1>
  
  <div id="calendar-loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="sr-only">加载中...</span>
    </div>
    <p class="mt-2">正在加载日历...</p>
  </div>
  
  <div id="calendar" style="display:none;"></div>
</div>

<!-- Modal for day details -->
<div class="modal fade" id="calendarDayModal" tabindex="-1" role="dialog" aria-labelledby="calendarDayModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="calendarDayModalLabel">日期详情</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body" id="calendarDayModalBody">
        <div class="text-center py-3">
          <div class="spinner-border text-primary" role="status">
            <span class="sr-only">加载中...</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- FullCalendar JS (本地文件 - 包含内联样式) -->
<script src="{% static 'fullcalendar/fullcalendar.min.js' %}"></script>
<script src="{% static 'js/calendar.js' %}"></script>

{% endblock %}
