{% extends 'base_generic.html' %}
{% load static %}

{% block content %}
<h1>复习日历</h1>
<div id="calendar"></div>

<!-- Modal for day details -->
<div class="modal fade" id="calendarDayModal" tabindex="-1" role="dialog" aria-labelledby="calendarDayModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="calendarDayModalLabel">日期详情</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body" id="calendarDayModalBody">
        <!-- AJAX 加载当天复习片段 -->
      </div>
    </div>
  </div>
</div>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/locales/zh-cn.js"></script>
<script src="{% static 'js/calendar.js' %}"></script>
<link rel="stylesheet" href="{% static 'css/calendar.css' %}">

{% endblock %}
