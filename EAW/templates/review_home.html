{% extends 'base_generic.html' %}
{% load static %}
{% block content %}
{% include "includes/banner.html" %}

<!-- Review Form Section -->
<section id="review-home" class="py-5" style="background-color: #f8f9fa;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8">
                <!-- Card for the header with blue background -->
                <div class="card mb-4 shadow border-0">
                    <div class="card-header text-center bg-primary text-white">
                        <h5 class="mb-0">Select a Date for Review</h5>
                    </div>
                    <div class="card-body">
                        <form id="reviewForm" action="" method="post" enctype="multipart/form-data" autocomplete="off" onsubmit="return loadReviewContent();">
                            {% csrf_token %}
                            <div class="input-group mb-3">
                                <input type="text" id="id_review_date" name="review_date" class="form-control" placeholder="YYYY-MM-DD">
                                <button type="submit" class="btn btn-primary">Review</button>
                            </div>
                            
                            <!-- Options Row -->
                            <div class="row g-3">
                                <!-- checkbox暂时隐藏，因为新逻辑中只要到了复习日期就应该显示 -->
                                <div class="col-md-6" style="display: none;">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="show_mastered" name="show_mastered">
                                        <label class="form-check-label" for="show_mastered">
                                            显示已掌握单词
                                        </label>
                                    </div>
                                </div>
                                <div class="col-md-12">
                                    <div class="d-flex align-items-center">
                                        <label for="per_page" class="me-2 mb-0">每页显示:</label>
                                        <select class="form-select form-select-sm" id="per_page" name="per_page" style="width: auto;">
                                            <option value="10" selected>10</option>
                                            <option value="20">20</option>
                                            <option value="50">50</option>
                                            <option value="100">100</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Card for the review content -->
                <!-- <div class="card shadow border-0"> -->
                    <!-- <div class="card-body"> -->
                        <div id="reviewContent" class="mt-4" style="display: none;"></div>
                    <!-- </div> -->
                <!-- </div> -->
            </div>
        </div>
    </div>
</section>

<!-- Flatpickr -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
    // ========== TTS 函数定义 (全局作用域) ==========
    
    // TTS 偏好管理函数
    window.getTTSPreference = function() {
        return localStorage.getItem('tts_preference') || 'google';
    };

    // Google TTS 播放函数
    window.playAudioWithGoogle = function(word, accent) {
        console.log('Google TTS开始播放:', word, accent);
        var tl = accent === 'us' ? 'en-US' : 'en-GB';
        var audioUrl = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=' + tl + '&q=' + encodeURIComponent(word);
        console.log('音频URL:', audioUrl);
        var audio = new Audio(audioUrl);
        audio.play().then(function() {
            console.log('Google TTS播放成功');
        }).catch(function(error) {
            console.error('Google TTS播放失败:', error);
            alert('Google TTS 播放失败，请尝试切换到浏览器 TTS 模式');
        });
    };

    // 浏览器 Web Speech API 播放函数
    window.playAudioWithBrowser = function(word, accent) {
        console.log('浏览器TTS开始播放:', word, accent);
        if (!('speechSynthesis' in window)) {
            alert('您的浏览器不支持语音合成功能');
            return;
        }

        // 停止当前播放
        window.speechSynthesis.cancel();

        var utterance = new SpeechSynthesisUtterance(word);
        var lang = accent === 'us' ? 'en-US' : 'en-GB';
        utterance.lang = lang;

        // 设置语速和音调
        utterance.rate = 0.9;
        utterance.pitch = 1.0;

        // 尝试选择匹配的语音
        var voices = window.speechSynthesis.getVoices();
        console.log('可用语音数量:', voices.length);
        var matchingVoice = voices.find(function(voice) {
            return voice.lang === lang;
        });
        if (matchingVoice) {
            utterance.voice = matchingVoice;
            console.log('使用语音:', matchingVoice.name);
        } else {
            console.log('未找到匹配的语音，使用默认语音');
        }

        utterance.onstart = function() {
            console.log('浏览器TTS开始播放');
        };
        utterance.onend = function() {
            console.log('浏览器TTS播放完成');
        };
        utterance.onerror = function(event) {
            console.error('浏览器TTS播放错误:', event);
        };

        window.speechSynthesis.speak(utterance);
    };

    // 根据口音播放（使用缓存的 TTS 偏好）
    window.playAudioWithAccent = function(word, accent) {
        console.log('播放音频:', word, accent);
        const method = window.getTTSPreference();
        console.log('TTS方法:', method);

        if (method === 'browser') {
            console.log('使用浏览器TTS播放:', word);
            window.playAudioWithBrowser(word, accent);
        } else {
            console.log('使用Google TTS播放:', word);
            window.playAudioWithGoogle(word, accent);
        }
    };

    // 更新 TTS 方法图标
    window.updateTTSMethodIcons = function() {
        const method = window.getTTSPreference();
        const icons = document.querySelectorAll('.tts-method-icon');

        if (method === 'browser') {
            icons.forEach(icon => {
                icon.innerHTML = '<i class="fa fa-headphones text-secondary"></i>';
                icon.title = '浏览器 TTS';
            });
        } else {
            icons.forEach(icon => {
                icon.innerHTML = '<i class="fa fa-google text-secondary"></i>';
                icon.title = 'Google TTS';
            });
        }
    };

    // 初始化语音库
    if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = function() {
            console.log('语音列表已加载');
        };
    }

    // 使用 window.onload 确保页面完全加载后再执行代码
    window.onload = function() {
        // 获取当天日期并格式化为 YYYY-MM-DD
        const today = new Date().toISOString().split('T')[0];

        // 确保在页面加载后输出当前日期
        console.log("当前日期为：", today); // 控制台日志确认

        // URL 带 ?date= 时直达该日期（/review/<date>/ 直链 302 回本页，#81）
        const urlParams = new URLSearchParams(window.location.search);
        const initialDate = urlParams.get('date') || today;
        const initialPerPage = urlParams.get('per_page');

        // 初始化 Flatpickr
        flatpickr("#id_review_date", {
            dateFormat: "Y-m-d",      // 设置日期格式
            defaultDate: initialDate  // 当天或 URL 指定日期
        });

        if (initialPerPage && document.querySelector(`#per_page option[value="${initialPerPage}"]`)) {
            document.getElementById('per_page').value = initialPerPage;
        }

        // URL 带日期参数时自动加载该日复习内容
        if (urlParams.get('date')) {
            loadReviewContent();
        }

        // 为checkbox添加change事件监听器
        document.getElementById('show_mastered').addEventListener('change', function() {
            const reviewDate = document.getElementById('id_review_date').value;
            if (reviewDate) {
                loadReviewContent();
            }
        });
        
        // 为下拉框添加change事件监听器
        document.getElementById('per_page').addEventListener('change', function() {
            const reviewDate = document.getElementById('id_review_date').value;
            if (reviewDate) {
                loadReviewContent();
            }
        });
    };

    // 更新行样式的函数
    function updateRowStyle(row, action, mastery) {
        // 移除整行文字的旧样式
        row.querySelectorAll('td').forEach(cell => {
            cell.classList.remove('text-success', 'text-danger', 'text-warning', 'fw-bold');
        });

        // 更新掌握程度文字
        const proficiencyCell = row.querySelector('.proficiency-cell');
        proficiencyCell.textContent = mastery;

        // 根据操作更新整行文字样式
        const cells = row.querySelectorAll('td');
        if (action === 'yes') {
            cells.forEach(cell => cell.classList.add('text-success')); // 文字变绿色
        } else if (action === 'no') {
            cells.forEach(cell => {
                cell.classList.add('text-danger', 'fw-bold'); // 文字变红且加粗
            });
        } else if (action === 'reset') {
            cells.forEach(cell => {
                cell.classList.add('text-danger', 'fw-bold'); // 文字变黄色且加粗
            });
        }
    }

    // 动态加载复习内容
    function loadReviewContent() {
        const reviewDate = document.getElementById("id_review_date").value;
        const showMastered = document.getElementById("show_mastered").checked;
        const perPage = document.getElementById("per_page").value;

        // 检查日期是否有效
        if (!reviewDate) {
            alert("请选择一个有效的日期！");
            return false; // 阻止表单提交
        }

        // 构建URL参数
        const params = new URLSearchParams({
            show_mastered: showMastered,
            per_page: perPage
        });

        // 发起 AJAX 请求加载复习内容
        const url = `/review/${reviewDate}?${params.toString()}`;
        fetch(url, {
            method: 'GET',
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => {
            if (response.ok) return response.text();
            throw new Error('加载复习内容失败');
        })
        .then(html => {
            const reviewContentDiv = document.getElementById('reviewContent');
            reviewContentDiv.innerHTML = html;
            reviewContentDiv.style.display = 'block';

            // 重新绑定动态内容中的事件
            bindReviewDayEvents();  // 确保绑定按钮事件

            // 初始化翻转卡模式（#82）
            initFlashcards();

            // 更新TTS图标和绑定TTS偏好选择器
            window.updateTTSMethodIcons();
            const ttsSelect = document.getElementById('tts-method-select');
            if (ttsSelect) {
                // 设置当前值
                ttsSelect.value = window.getTTSPreference();

                // 监听变化
                ttsSelect.addEventListener('change', function() {
                    const newMethod = this.value;
                    localStorage.setItem('tts_preference', newMethod);
                    console.log('TTS 偏好已设置为:', newMethod);

                    // 更新 TTS 图标
                    window.updateTTSMethodIcons();
                });
            }

            // 手动触发 MathJax 渲染
            if (window.MathJax) {
                MathJax.typeset(); // 渲染数学公式
            }
        })
        .catch(error => {
            console.error(error);
            alert('加载失败，请稍后重试');
        });

        return false; // 阻止默认表单提交
    }

    // ==================== 翻转卡模式（#82：一次一卡、键盘/手势判定、正面自动发音） ====================

    // 积分奖励 toast（原 review_day.html 行内脚本定义，但该脚本在 AJAX 注入下从不执行——搬到真正运行的 review_home）
    function showPointsRewardToast(pointsEarned, currentPoints, currentStreak) {
        const toastContainer = document.createElement('div');
        toastContainer.className = 'position-fixed top-0 end-0 p-3';
        toastContainer.style.zIndex = '9999';
        toastContainer.id = 'points-reward-toast';
        toastContainer.innerHTML = `
            <div class="toast show" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="toast-header bg-success text-white">
                    <i class="fa fa-star me-2"></i>
                    <strong class="me-auto">积分奖励</strong>
                    <button type="button" class="btn-close btn-close-white" aria-label="Close"></button>
                </div>
                <div class="toast-body">
                    <div class="mb-2">
                        <i class="fa fa-check-circle text-success"></i>
                        <strong>恭喜！获得 ${pointsEarned} 积分</strong>
                    </div>
                    <div class="small text-muted">
                        当前积分：<strong>${currentPoints}</strong>
                        ${currentStreak !== undefined ? `<br>连续学习：<strong>${currentStreak}</strong> 天` : ''}
                    </div>
                    <div class="mt-2">
                        <a href="/points/market/" class="btn btn-sm btn-primary">
                            <i class="fa fa-shopping-cart"></i> 前往积分商城
                        </a>
                    </div>
                </div>
            </div>`;
        document.body.appendChild(toastContainer);
        const closeBtn = toastContainer.querySelector('.btn-close');
        if (closeBtn) closeBtn.addEventListener('click', () => toastContainer.remove());
        setTimeout(() => { if (document.getElementById('points-reward-toast')) toastContainer.remove(); }, 5000);
    }

    const FC = {
        items: [],
        pos: -1,          // 当前卡片在 items 中的下标
        answered: new Set(),
        flipped: false,
        swipeConsumed: false
    };

    function fcAutoplayPref() {
        return localStorage.getItem('flashcard_autoplay') !== '0';
    }

    // 静默自动发音：不走 playAudioWithAccent（其失败会 alert），自动播失败直接吞掉（iOS 首次触摸前必被拦截）
    function fcAutoplay(word) {
        if (!fcAutoplayPref()) return;
        try {
            const audio = new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en-US&q=' + encodeURIComponent(word));
            audio.play().catch(function() {});
        } catch (e) { /* 静默 */ }
    }

    function fcCurrent() {
        return (FC.pos >= 0 && FC.pos < FC.items.length) ? FC.items[FC.pos] : null;
    }

    function fcUnansweredCount() {
        return FC.items.filter(it => !it.reviewed_today && !FC.answered.has(it.id)).length;
    }

    function fcApplyMode(mode) {
        localStorage.setItem('review_mode', mode);
        const cardMode = document.getElementById('cardMode');
        const listMode = document.getElementById('listMode');
        if (!cardMode || !listMode) return;
        cardMode.classList.toggle('d-none', mode !== 'card');
        listMode.classList.toggle('d-none', mode === 'card');
        const cBtn = document.getElementById('modeCardBtn');
        const lBtn = document.getElementById('modeListBtn');
        if (cBtn && lBtn) {
            cBtn.classList.toggle('active', mode === 'card');
            lBtn.classList.toggle('active', mode !== 'card');
        }
    }

    function fcToggleMode(preferred) {
        const current = localStorage.getItem('review_mode') ||
            (window.matchMedia('(max-width: 768px)').matches ? 'card' : 'list');
        fcApplyMode(preferred || (current === 'card' ? 'list' : 'card'));
    }

    function fcUpdateProgress() {
        const total = FC.items.length;
        const preReviewed = FC.items.filter(it => it.reviewed_today).length;
        const done = preReviewed + FC.answered.size;
        const bar = document.getElementById('fcProgressBar');
        const text = document.getElementById('fcProgressText');
        if (bar) bar.style.width = (total ? Math.round(done / total * 100) : 0) + '%';
        if (text) text.textContent = done + ' / ' + total;
    }

    function fcRender() {
        const item = fcCurrent();
        const stage = document.getElementById('fcStage');
        const actions = document.getElementById('fcActions');
        const done = document.getElementById('fcDone');
        if (!item) {
            // 本页全部完成
            if (stage) stage.classList.add('d-none');
            if (actions) actions.classList.add('d-none');
            if (done) done.classList.remove('d-none');
            fcUpdateProgress();
            return;
        }
        if (stage) stage.classList.remove('d-none');
        if (actions) actions.classList.remove('d-none');
        if (done) done.classList.add('d-none');
        FC.flipped = false;
        const front = document.getElementById('fcFaceFront');
        const back = document.getElementById('fcFaceBack');
        front.classList.remove('d-none');
        back.classList.add('d-none');

        const card = document.getElementById('flashcard');
        card.classList.toggle('fc-extra', item.is_extra);
        card.disabled = false;

        document.getElementById('fcWord').textContent = item.word;
        document.getElementById('fcCategory').textContent = item.category;
        const phonetics = [];
        if (item.us_phonetic) phonetics.push('美 [' + item.us_phonetic + ']');
        if (item.uk_phonetic) phonetics.push('英 [' + item.uk_phonetic + ']');
        document.getElementById('fcPhonetics').textContent = phonetics.join('　');

        const tts = document.getElementById('fcTtsButtons');
        tts.innerHTML = '';
        [['us', '美'], ['uk', '英']].forEach(([accent, label]) => {
            if (item[(accent === 'us' ? 'us_phonetic' : 'uk_phonetic')]) {
                const b = document.createElement('button');
                b.className = 'btn btn-sm btn-outline-primary me-1';
                b.innerHTML = '<i class="fa fa-volume-up"></i> ' + label;
                b.addEventListener('click', function(e) {
                    e.stopPropagation();
                    window.playAudioWithAccent(item.word, accent);
                });
                tts.appendChild(b);
            }
        });

        document.getElementById('fcContent').innerHTML = item.content;
        document.getElementById('fcMeta').innerHTML =
            '<span><i class="fa fa-refresh"></i> ' + item.cycle_label + '</span>' +
            '<span><i class="fa fa-calendar"></i> 录入 ' + (item.input_date || '-') + '</span>' +
            (item.next_after_yes ? '<span><i class="fa fa-arrow-right"></i> 认识后下次 ' + item.next_after_yes + '</span>' : '');

        // 翻面后重排公式（内容含 MathJax/LaTeX，#82）
        if (window.MathJax && window.MathJax.typesetPromise) {
            window.MathJax.typesetPromise([back]).catch(function() {});
        } else if (window.MathJax) {
            try { window.MathJax.typeset([back]); } catch (e) {}
        }

        // 正面自动播一次发音（偏好可关）
        fcAutoplay(item.word);

        const disable = item.reviewed_today;
        document.getElementById('fcYesBtn').disabled = disable;
        document.getElementById('fcNoBtn').disabled = disable;
        fcUpdateProgress();
    }

    function fcNext() {
        const items = FC.items;
        for (let i = FC.pos + 1; i < items.length; i++) {
            if (!items[i].reviewed_today && !FC.answered.has(items[i].id)) { FC.pos = i; fcRender(); return; }
        }
        for (let i = 0; i < items.length; i++) {
            if (!items[i].reviewed_today && !FC.answered.has(items[i].id)) { FC.pos = i; fcRender(); return; }
        }
        FC.pos = -1;
        fcRender(); // 全部完成 → done 状态
    }

    function fcFlip() {
        const item = fcCurrent();
        if (!item) return;
        FC.flipped = !FC.flipped;
        const front = document.getElementById('fcFaceFront');
        const back = document.getElementById('fcFaceBack');
        front.classList.toggle('d-none', FC.flipped);
        back.classList.toggle('d-none', !FC.flipped);
        if (FC.flipped) {
            const incoming = back;
            incoming.classList.remove('fc-flip-in');
            void incoming.offsetWidth; // 重启动画
            incoming.classList.add('fc-flip-in');
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([incoming]).catch(function() {});
            }
        }
    }

    function fcAnswer(action) {
        const item = fcCurrent();
        if (!item || item.reviewed_today || FC.answered.has(item.id)) return;
        const currentReviewDate = document.getElementById("id_review_date").value;
        fetch(`/review-feedback/${action}/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({ id: item.id, date: currentReviewDate })
        })
        .then(r => r.json())
        .then(response => {
            if (!response.success) {
                alert("操作失败：" + response.message);
                return;
            }
            FC.answered.add(item.id);
            // 同步清单模式的表格行
            const row = document.getElementById('td' + item.id);
            if (row) {
                row.setAttribute('data-reviewed-today', '1');
                if (typeof updateRowStyle === 'function') {
                    updateRowStyle(row, action, response.mastery);
                }
            }
            if (typeof response.points_earned !== 'undefined' && response.points_earned > 0
                    && typeof showPointsRewardToast === 'function') {
                showPointsRewardToast(response.points_earned, response.current_points, response.current_streak);
            }
            fcNext();
        })
        .catch(err => console.error('flashcard answer error:', err));
    }

    function fcReset() {
        const item = fcCurrent();
        if (!item) return;
        if (!confirm('确认要重新开始「' + item.word + '」的复习周期吗？这将清除该词的全部学习记录。')) return;
        const currentReviewDate = document.getElementById("id_review_date").value;
        fetch('/review-feedback/reset/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({ id: item.id, date: currentReviewDate })
        })
        .then(r => r.json())
        .then(response => {
            if (response.success) {
                // 与清单模式一致：RESET 后重载本日内容
                loadReviewContent();
            } else {
                alert("重置失败：" + response.message);
            }
        })
        .catch(err => console.error('flashcard reset error:', err));
    }

    function initFlashcards() {
        const jsonEl = document.getElementById('cardItemsJson');
        const cardMode = document.getElementById('cardMode');
        if (!jsonEl || !cardMode) return;

        try { FC.items = JSON.parse(jsonEl.textContent); } catch (e) { FC.items = []; }
        FC.pos = -1;
        FC.answered = new Set();

        // 默认模式：移动端卡片，桌面清单（定稿）；选择记忆在 localStorage
        const savedMode = localStorage.getItem('review_mode') ||
            (window.matchMedia('(max-width: 768px)').matches ? 'card' : 'list');
        fcApplyMode(savedMode);

        // 从第一个未复习的卡开始（已点评的跳过）
        fcNext();

        // 自动发音开关
        const autoSwitch = document.getElementById('flashcardAutoplaySwitch');
        if (autoSwitch) {
            autoSwitch.checked = fcAutoplayPref();
            autoSwitch.addEventListener('change', function() {
                localStorage.setItem('flashcard_autoplay', this.checked ? '1' : '0');
            });
        }

        // 模式切换按钮
        const cBtn = document.getElementById('modeCardBtn');
        const lBtn = document.getElementById('modeListBtn');
        if (cBtn) cBtn.onclick = () => fcApplyMode('card');
        if (lBtn) lBtn.onclick = () => fcApplyMode('list');

        // 翻面 / 判定 / 重置
        const card = document.getElementById('flashcard');
        if (card) {
            card.addEventListener('click', function() {
                if (FC.swipeConsumed) { FC.swipeConsumed = false; return; }
                fcFlip();
            });
            // 移动端滑动手势：右滑认识 / 左滑不认识；屏幕左右 30px 边缘豁免给系统返回手势
            card.addEventListener('touchstart', function(e) {
                FC.touchStartX = e.changedTouches[0].clientX;
                FC.touchStartY = e.changedTouches[0].clientY;
            }, { passive: true });
            card.addEventListener('touchend', function(e) {
                if (FC.touchStartX === undefined) return;
                const dx = e.changedTouches[0].clientX - FC.touchStartX;
                const dy = e.changedTouches[0].clientY - FC.touchStartY;
                FC.touchStartX = undefined;
                const w = window.innerWidth;
                const start = e.changedTouches[0].clientX - dx; // 起点
                if (start < 30 || start > w - 30) return;       // 边缘豁免
                if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)) return;
                FC.swipeConsumed = true;
                fcAnswer(dx > 0 ? 'yes' : 'no');
            }, { passive: true });
        }
        const yesBtn = document.getElementById('fcYesBtn');
        const noBtn = document.getElementById('fcNoBtn');
        const resetBtn = document.getElementById('fcResetBtn');
        if (yesBtn) yesBtn.onclick = () => fcAnswer('yes');
        if (noBtn) noBtn.onclick = () => fcAnswer('no');
        if (resetBtn) resetBtn.onclick = fcReset;
        const reloadBtn = document.getElementById('fcReloadBtn');
        if (reloadBtn) reloadBtn.onclick = () => loadReviewContent();

        // 键盘快捷键（页面级只绑一次）
        if (!window.__fcKeysBound) {
            window.__fcKeysBound = true;
            document.addEventListener('keydown', function(e) {
                const mode = localStorage.getItem('review_mode') ||
                    (window.matchMedia('(max-width: 768px)').matches ? 'card' : 'list');
                if (mode !== 'card') return;
                const tag = (e.target.tagName || '').toUpperCase();
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
                if (document.querySelector('.modal.show')) return; // 清单 modal 打开时不抢按键
                if (!document.getElementById('cardMode') || document.getElementById('cardMode').classList.contains('d-none')) return;
                if (e.key === ' ') { e.preventDefault(); fcFlip(); }
                else if (e.key === 'ArrowRight') { e.preventDefault(); fcAnswer('yes'); }
                else if (e.key === 'ArrowLeft') { e.preventDefault(); fcAnswer('no'); }
                else if (e.key === 'r' || e.key === 'R') { fcReset(); }
            });
        }
    }

    // 绑定 review_day.html 中的事件
    function bindReviewDayEvents() {
        console.log("Binding events for feedback buttons...");
        
        // 绑定反馈按钮点击事件
        document.querySelectorAll('.feedback-btn').forEach(button => {
            button.addEventListener('click', function (event) {
                const button = event.target;
                const wordId = button.getAttribute('data-id');
                const action = button.getAttribute('data-action');
                const row = document.getElementById(`td${wordId}`);
                
                // 如果是RESET操作，先弹出确认对话框
                if (action === 'reset') {
                    if (!confirm('确认要重新开始复习周期吗？这将清除所有学习记录。')) {
                        return; // 用户取消操作
                    }
                }
                
                // 从日期选择器获取当前选择的日期，而不是使用模板变量
                const currentReviewDate = document.getElementById("id_review_date").value;
                const data = JSON.stringify({ id: wordId, date: currentReviewDate });

                // 通用 POST 请求处理
                fetch(`/review-feedback/${action}/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}',
                    },
                    body: data,
                })
                .then(response => response.json())
                .then(response => {
                    if (response.success) {
                        // 如果是YES或NO操作，自动跳转到下一个未复习的单词
                        if (action === 'yes' || action === 'no') {
                            // 标记当前单词已复习
                            row.setAttribute('data-reviewed', 'true');
                            
                            // 关闭当前modal
                            const currentModalElement = document.getElementById('myModal' + wordId);
                            const currentModal = bootstrap.Modal.getInstance(currentModalElement);
                            if (currentModal) {
                                currentModal.hide();
                            }
                            
                            // 查找下一个未复习的单词
                            const allRows = document.querySelectorAll('tbody tr[id^="td"]');
                            let foundCurrent = false;
                            let nextRow = null;
                            
                            for (let i = 0; i < allRows.length; i++) {
                                if (allRows[i].id === 'td' + wordId) {
                                    foundCurrent = true;
                                } else if (foundCurrent && !allRows[i].getAttribute('data-reviewed')) {
                                    nextRow = allRows[i];
                                    break;
                                }
                            }
                            
                            // 如果没找到后面的，从头开始找第一个未复习的
                            if (!nextRow) {
                                for (let i = 0; i < allRows.length; i++) {
                                    if (!allRows[i].getAttribute('data-reviewed')) {
                                        nextRow = allRows[i];
                                        break;
                                    }
                                }
                            }
                            
                            // 打开下一个modal
                            if (nextRow) {
                                setTimeout(() => {
                                    const nextWordId = nextRow.id.replace('td', '');
                                    const nextModalElement = document.getElementById('myModal' + nextWordId);
                                    const nextModal = new bootstrap.Modal(nextModalElement);
                                    nextModal.show();
                                }, 300); // 延迟300ms确保当前modal完全关闭
                            } else {
                                // 没有更多单词，清除可能残留的backdrop并重新加载内容
                                setTimeout(() => {
                                    const backdrops = document.querySelectorAll('.modal-backdrop');
                                    backdrops.forEach(backdrop => backdrop.remove());
                                    document.body.classList.remove('modal-open');
                                    document.body.style.overflow = '';
                                    document.body.style.paddingRight = '';
                                    
                                    // 重新加载内容以刷新日期
                                    loadReviewContent();
                                }, 300);
                            }
                        } else if (action === 'reset') {
                            // RESET操作后更新样式并重新加载内容
                            updateRowStyle(row, action, response.mastery);
                            setTimeout(() => {
                                loadReviewContent();
                            }, 500);
                        } else {
                            updateRowStyle(row, action, response.mastery);
                        }
                    } else {
                        alert("操作失败：" + response.message);
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                });
            });
        });
        
        // 绑定分页链接点击事件
        document.querySelectorAll('.pagination-link').forEach(link => {
            link.addEventListener('click', function(event) {
                event.preventDefault();
                const page = event.target.getAttribute('data-page');
                const reviewDate = document.getElementById('id_review_date').value;
                const showMastered = document.getElementById('show_mastered').checked;
                const perPage = document.getElementById('per_page').value;
                
                // 构建URL参数
                const params = new URLSearchParams({
                    show_mastered: showMastered,
                    per_page: perPage,
                    page: page
                });
                
                // 发起 AJAX 请求加载指定页的内容
                const url = `/review/${reviewDate}?${params.toString()}`;
                fetch(url, {
                    method: 'GET',
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                })
                .then(response => {
                    if (response.ok) return response.text();
                    throw new Error('加载分页内容失败');
                })
                .then(html => {
                    const reviewContentDiv = document.getElementById('reviewContent');
                    reviewContentDiv.innerHTML = html;
                    
                    // 重新绑定事件
                    bindReviewDayEvents();
                    
                    // 手动触发 MathJax 渲染
                    if (window.MathJax) {
                        MathJax.typeset();
                    }
                    
                    // 滚动到顶部
                    reviewContentDiv.scrollIntoView({ behavior: 'smooth' });
                })
                .catch(error => {
                    console.error(error);
                    alert('加载失败，请稍后重试');
                });
            });
        });
    }
</script>
