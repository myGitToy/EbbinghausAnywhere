{% extends "base_generic.html" %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">📚 词汇表</h2>
    <p class="text-muted mb-4">浏览预置词汇表，选择单词并导入到您的学习计划中</p>

    <div class="row">
        {% for book in books %}
        <div class="col-md-4 mb-3">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">{{ book.name }}</h5>
                    <p class="card-text">{{ book.description|default:"暂无描述" }}</p>
                    <p class="card-text">
                        <small class="text-muted">
                            {% if book.level %}
                                <span class="badge bg-secondary">{{ book.level }}</span>
                            {% endif %}
                            <span class="ms-2">{{ book.word_count }} 个单词</span>
                        </small>
                    </p>
                    <a href="{% url 'vocabulary-detail' book.id %}" class="btn btn-primary">
                        <i class="fa fa-eye"></i> 浏览并选择
                    </a>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12">
            <div class="alert alert-info">
                <i class="fa fa-info-circle"></i> 暂无可用的词汇表
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
